<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจคำขอหยุดงานน้ำท่วม</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <div class="eyebrow">ฝ่ายบุคคล · HR-FL01</div>
    <h1>ตรวจคำขอหยุดงานเนื่องจากอุทกภัย</h1>
    <div class="tide" aria-hidden="true"></div>
  </header>

  <!-- login -->
  <section id="view-login">
    <form id="loginForm" class="card" style="max-width:420px;margin:24px auto 0" novalidate>
      <h2>เข้าสู่ระบบฝ่ายบุคคล</h2>
      <label class="field"><span>อีเมล</span><input type="email" id="l-email" autocomplete="username"></label>
      <label class="field"><span>รหัสผ่าน</span><input type="password" id="l-pass" autocomplete="current-password"></label>
      <div id="loginMsg" class="msg err" hidden></div>
      <div class="actions"><button class="btn" type="submit" id="loginBtn">เข้าสู่ระบบ</button><a class="btn ghost" href="./">กลับไปหน้าแบบฟอร์ม</a></div>
    </form>
  </section>

  <!-- dashboard -->
  <section id="view-dash" hidden>
    <nav class="tabs"><span style="padding:10px 0" class="hint" id="who"></span><span class="spacer"></span><button type="button" id="refreshBtn">รีเฟรช</button><button type="button" id="logoutBtn">ออกจากระบบ</button></nav>
    <div id="dashMsg" class="msg" hidden></div>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input type="text" id="q" placeholder="ค้นหาชื่อ รหัส แผนก พื้นที่ หรือเลขคำขอ">
      <select id="fStatus" aria-label="กรองสถานะ">
        <option value="">ทุกสถานะ</option>
        <option value="pending">รอตรวจสอบ</option>
        <option value="approved">อนุมัติ</option>
        <option value="rejected">ไม่อนุมัติ</option>
      </select>
      <button class="btn ghost sm" type="button" id="csvBtn">ดาวน์โหลด CSV</button>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt="รูปหลักฐานขนาดเต็ม"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const C = window.APP_CONFIG;
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const STATUS = {pending:"รอตรวจสอบ", approved:"อนุมัติ", rejected:"ไม่อนุมัติ"};
let rows = [], me = null;
const openIds = new Set(), photoCache = new Map();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const thDate = iso => iso ? new Date(iso + (iso.length===10 ? "T00:00:00" : "")).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"}) : "–";
const thDateTime = iso => iso ? new Date(iso).toLocaleString("th-TH",{day:"numeric",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "–";
function dashMsg(t, kind="info"){ const el = $("#dashMsg"); el.className = "msg " + kind; el.textContent = t; el.hidden = !t; }

/* auth */
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const m = $("#loginMsg"); m.hidden = true;
  $("#loginBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({email: $("#l-email").value.trim(), password: $("#l-pass").value});
  $("#loginBtn").disabled = false;
  if(error){ m.textContent = "อีเมลหรือรหัสผ่านไม่ถูกต้อง"; m.hidden = false; return; }
  $("#l-pass").value = "";
  enter();
});
$("#logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
$("#refreshBtn").addEventListener("click", load);

async function enter(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $("#view-login").hidden = false; $("#view-dash").hidden = true; return; }
  me = session.user;
  const { data: ok } = await sb.rpc("is_hr");
  $("#view-login").hidden = true; $("#view-dash").hidden = false;
  $("#who").textContent = me.email;
  if(!ok){ dashMsg(`บัญชี ${me.email} ยังไม่อยู่ในรายชื่อฝ่ายบุคคล ให้ผู้ดูแลระบบเพิ่มอีเมลนี้ในตาราง hr_admins`, "err"); return; }
  load();
}

async function load(){
  const { data, error } = await sb.from(C.TABLE).select("*").order("created_at", {ascending:false}).limit(2000);
  if(error){ dashMsg("โหลดข้อมูลไม่สำเร็จ: " + error.message, "err"); return; }
  dashMsg("");
  rows = data || [];
  render();
}

/* render */
function render(){
  const pend = rows.filter(r => r.status==="pending").length;
  const appr = rows.filter(r => r.status==="approved").length;
  const days = rows.filter(r => r.status!=="rejected").reduce((s,r) => s + (r.days||0), 0);
  const people = new Set(rows.map(r => (r.emp_id||"").toLowerCase())).size;
  $("#stats").innerHTML = [[rows.length,"คำขอทั้งหมด"],[pend,"รอตรวจสอบ"],[appr,"อนุมัติแล้ว"],[people,"พนักงานที่แจ้ง"],[days,"วันหยุดรวม (ไม่นับที่ไม่อนุมัติ)"]]
    .map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  const q = $("#q").value.trim().toLowerCase(), fs = $("#fStatus").value;
  const shown = rows.filter(r => (!fs || r.status===fs) && (!q || [r.full_name,r.emp_id,r.department,r.area,r.ref_code].join(" ").toLowerCase().includes(q)));
  $("#list").innerHTML = shown.length ? shown.map(item).join("") :
    `<div class="empty">${rows.length ? "ไม่มีคำขอที่ตรงกับการค้นหา" : "ยังไม่มีพนักงานส่งคำขอ"}</div>`;
  document.querySelectorAll("details.item").forEach(d => { if(openIds.has(d.dataset.id)){ d.open = true; loadPhotos(d); } });
}
function item(r){
  return `<details class="item" data-id="${esc(r.id)}">
    <summary><span class="who">${esc(r.full_name)} <span class="hint">· ${esc(r.emp_id)} · ${esc(r.department)}</span></span><span class="pill ${esc(r.status)}">${STATUS[r.status]||esc(r.status)}</span>
    <span class="meta">${esc(r.ref_code)} · ${thDate(r.date_from)} – ${thDate(r.date_to)} · ${r.days} วัน · ${esc(r.area)}</span></summary>
    <div class="detail">
      <dl class="kv">
        <dt>เบอร์โทร</dt><dd>${esc(r.phone)}</dd>
        <dt>สาเหตุ</dt><dd>${(r.causes||[]).map(esc).join(", ")}</dd>
        <dt>รายละเอียด</dt><dd>${esc(r.detail)}</dd>
        <dt>ระดับน้ำ</dt><dd>${esc(r.water_level)}</dd>
        <dt>ส่งเมื่อ</dt><dd>${thDateTime(r.created_at)}</dd>
        ${r.reviewed_at ? `<dt>ตรวจโดย</dt><dd>${esc(r.reviewed_by)} · ${thDateTime(r.reviewed_at)}</dd>` : ""}
      </dl>
      <div class="thumbs" data-photos><div class="hint">กำลังโหลดรูป ${(r.photo_paths||[]).length} รูป…</div></div>
      <div class="grid2" style="align-items:end">
        <label class="field"><span>หมายเหตุถึงพนักงาน</span><input type="text" id="note-${esc(r.id)}" value="${esc(r.review_note)}" placeholder="ไม่บังคับ" maxlength="500"></label>
        <div class="actions">
          <button class="btn okb sm" type="button" data-act="approved" data-id="${esc(r.id)}">อนุมัติ</button>
          <button class="btn badb sm" type="button" data-act="rejected" data-id="${esc(r.id)}">ไม่อนุมัติ</button>
          ${r.status!=="pending" ? `<button class="btn ghost sm" type="button" data-act="pending" data-id="${esc(r.id)}">กลับเป็นรอตรวจ</button>` : ""}
        </div>
      </div>
    </div>
  </details>`;
}
document.addEventListener("toggle", e => {
  const d = e.target; if(!d.matches || !d.matches("details.item")) return;
  if(d.open){ openIds.add(d.dataset.id); loadPhotos(d); } else openIds.delete(d.dataset.id);
}, true);
async function loadPhotos(d){
  const box = d.querySelector("[data-photos]"); if(!box || box.dataset.loaded) return;
  box.dataset.loaded = "1";
  const r = rows.find(x => x.id === d.dataset.id); if(!r) return;
  try{
    let urls = photoCache.get(r.id);
    if(!urls){
      const { data, error } = await sb.storage.from(C.BUCKET).createSignedUrls(r.photo_paths || [], 3600);
      if(error) throw error;
      urls = data.map(x => x.signedUrl).filter(Boolean);
      photoCache.set(r.id, urls);
    }
    box.innerHTML = urls.length ? urls.map((u,i) => `<div class="thumb"><img src="${esc(u)}" alt="รูปหลักฐาน ${i+1}" data-lb loading="lazy"></div>`).join("") : `<div class="hint">ไม่พบรูป</div>`;
  }catch(e){ box.innerHTML = `<div class="hint">โหลดรูปไม่สำเร็จ</div>`; delete box.dataset.loaded; }
}
$("#q").addEventListener("input", render);
$("#fStatus").addEventListener("change", render);

$("#list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const id = b.dataset.id, note = ($("#note-" + CSS.escape(id))?.value || "").trim();
  b.disabled = true;
  const patch = b.dataset.act === "pending"
    ? {status:"pending", review_note: note || null, reviewed_at: null, reviewed_by: null}
    : {status: b.dataset.act, review_note: note || null, reviewed_at: new Date().toISOString(), reviewed_by: me.email};
  const { error } = await sb.from(C.TABLE).update(patch).eq("id", id);
  if(error){ dashMsg("บันทึกผลไม่สำเร็จ: " + error.message, "err"); b.disabled = false; return; }
  Object.assign(rows.find(r => r.id === id), patch);
  render();
});

document.addEventListener("click", e => { if(e.target.matches("img[data-lb]")){ $("#lbImg").src = e.target.src; $("#lightbox").hidden = false; } });
$("#lightbox").addEventListener("click", () => $("#lightbox").hidden = true);
document.addEventListener("keydown", e => { if(e.key==="Escape") $("#lightbox").hidden = true; });

$("#csvBtn").addEventListener("click", () => {
  const cols = [["เลขคำขอ","ref_code"],["รหัสพนักงาน","emp_id"],["ชื่อ","full_name"],["แผนก","department"],["โทร","phone"],["ตั้งแต่","date_from"],["ถึง","date_to"],["จำนวนวัน","days"],["สาเหตุ","causes"],["รายละเอียด","detail"],["พื้นที่","area"],["ระดับน้ำ","water_level"],["จำนวนรูป","photo_paths"],["สถานะ","status"],["หมายเหตุ","review_note"],["ตรวจโดย","reviewed_by"],["ส่งเมื่อ","created_at"]];
  const cell = x => `"${String(x ?? "").replace(/"/g,'""')}"`;
  const lines = rows.map(r => cols.map(([,k]) =>
    k==="causes" ? cell((r.causes||[]).join("; ")) :
    k==="photo_paths" ? (r.photo_paths||[]).length :
    k==="status" ? cell(STATUS[r.status]) :
    k==="created_at" ? cell(thDateTime(r.created_at)) : cell(r[k])).join(","));
  const csv = "﻿" + [cols.map(c => cell(c[0])).join(","), ...lines].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = `flood-leave-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

enter();
})();
</script>
</body>
</html>
